[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "fingerprint-project"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "matplotlib",
    "Pillow",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]